$kind: http-request
url: http://127.0.0.1:8000/api/v1/auth/login
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"pelanggan@gmail.com\",\r

    \  \"password\": \"pelanggan\",\r

    \  \"device_name\": \"Postman Praktikum\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      pm.environment.set('customer_token', json.access_token);"
    language: text/javascript
order: 3000
