$kind: http-request
name: New Request
url: http://127.0.0.1:8000/api/v1/checkout
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \"recipient_name\": \"Budi Customer\",\r

    \"phone\": \"081234567890\",\r

    \"address\": \"Jl. Praktikum No. 10, Purwokerto\",\r

    \"shipping_service_id\": 1,\r

    \"items\": [\r

    {\"product_id\": 1, \"quantity\": 2},\r

    {\"product_id\": 2, \"quantity\": 1}\r

    ]\r

    }\r\n"
auth:
  type: bearer
  credentials:
    token: "{{customer_token}}"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json();\r

      pm.environment.set('customer_token', json.access_token);"
    language: text/javascript
order: 5000
